# Example checked-in defaults for the external Spring consumer sample.
# Keep real credentials out of source control in real applications.
# Prefer environment variables, a secret manager, or a host-provided
# CoderhinoAgentCredentialProvider / ModelClient bean for production usage.

coderhino.agent.provider-api-type=CLAUDE_CODE
coderhino.agent.model=MiniMax-M2.7
coderhino.agent.context-window=128000
coderhino.agent.max-output-tokens=4096

# Optional when using provider defaults; keep it here as a visible example.
coderhino.agent.api-base-url=https://api.minimaxi.com/anthropic

# Replace locally before using a live provider, or provide a
# CoderhinoAgentCredentialProvider bean as shown in this module.
coderhino.agent.api-key=replace-with-your-api-key
